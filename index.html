<title>Central de Jogos · Acesso</title>

<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E12;--panel:#141A21;--line:rgba(255,255,255,.14);--ink:#EEF2F5;--muted:#93A1B0;--hivis:#FFB400;--bad:#E5383B;--hazard:repeating-linear-gradient(-45deg,#FFB400 0 14px,#15171A 14px 28px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(ellipse 80% 70% at 50% 30%,#18222E 0%,var(--bg) 70%);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
body{display:grid;place-items:center;padding:16px}
.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.hz{height:14px;background:var(--hazard)}
.body{padding:26px 26px 24px;display:grid;gap:16px}
.eyebrow{font:600 11.5px "IBM Plex Mono",monospace;letter-spacing:.2em;color:var(--hivis);text-transform:uppercase}
h1{margin:0;font:700 38px/.95 "Chakra Petch",sans-serif;text-transform:uppercase}h1 em{font-style:normal;color:var(--hivis)}
p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}
label{display:grid;gap:6px;font:600 11px sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pw{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04)}
.pw:focus-within{border-color:var(--hivis)}
.pw input{flex:1;min-width:0;height:48px;border:0;background:transparent;color:var(--ink);font:600 18px "IBM Plex Mono",monospace;padding:0 14px;outline:none;letter-spacing:.08em}
.pw button{border:0;background:transparent;color:var(--muted);font:600 12px sans-serif;padding:0 14px;cursor:pointer}
.rem{display:flex;gap:9px;align-items:center;font:500 13.5px sans-serif;letter-spacing:0;text-transform:none;color:var(--ink);cursor:pointer}
.rem input{width:18px;height:18px;accent-color:var(--hivis)}
.go{height:52px;border:0;border-radius:12px;background:var(--hivis);color:#191200;font:700 17px "Chakra Petch",sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 0 #A87600}
.go:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;font-size:13.5px;color:#FF8A8C}.msg.ok{color:#5CE59A}
.foot{font:500 12px "IBM Plex Mono",monospace;color:#6F7C89;text-align:center}
.shake{animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="hz"></div>

    <span class="eyebrow">Acesso do professor</span>
    <h1>Central<br><em>de Jogos</em></h1>
    <p>Digite a senha de acesso para abrir a Central de Jogos.</p>

    </label>
    <label class="rem"><input type="checkbox" id="rem"> Lembrar neste computador por 6 horas</label>
    <button class="go" id="go" type="submit">Entrar</button>
    <div class="msg" id="msg" role="status"></div>
    <div class="foot">Por: Nelton Silva</div>
  </div>
</form>

const $ = s => document.querySelector(s);
const KEY = 'cj-chave', TTL = 6 * 3600e3;
const bin = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = u => btoa(String.fromCharCode(...new Uint8Array(u)));
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bin(DATA.salt), iterations: DATA.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function open_(key) {
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin(DATA.iv) }, key, bin(DATA.ct)));
  document.open(); document.write(html); document.close();
}
async function save(key, remember) {
  const raw = hex(await crypto.subtle.exportKey('raw', key));
  try { sessionStorage.setItem(KEY, raw); if (remember) localStorage.setItem(KEY, JSON.stringify({ k: raw, exp: Date.now() + TTL })); else localStorage.removeItem(KEY); } catch (e) { }
}
const imp = raw => crypto.subtle.importKey('raw', bin(raw), 'AES-GCM', false, ['decrypt']);
let fails = 0;
$('#eye').onclick = () => { const i = $('#pw'); i.type = i.type === 'password' ? 'text' : 'password'; $('#eye').textContent = i.type === 'password' ? 'mostrar' : 'ocultar'; };
$('#f').onsubmit = async e => {
  e.preventDefault(); const pw = $('#pw').value; if (!pw) return;
  $('#go').disabled = true; $('#go').textContent = 'Verificando…'; $('#msg').className = 'msg'; $('#msg').textContent = '';
  try {
    const key = await keyFrom(pw);
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin(DATA.iv) }, key, bin(DATA.ct));
    $('#msg').className = 'msg ok'; $('#msg').textContent = 'Senha correta. Abrindo…';
    await save(key, $('#rem').checked); setTimeout(() => open_(key), 150);
  } catch (err) {
    fails++; $('#msg').textContent = 'Senha incorreta.';
    $('#f').classList.remove('shake'); void $('#f').offsetWidth; $('#f').classList.add('shake');
    setTimeout(() => { $('#go').disabled = false; $('#go').textContent = 'Entrar'; $('#pw').select(); }, Math.min(8000, 600 * fails));
  }
};
// acesso já aberto nesta aba, ou lembrado neste computador (6 h): entra direto
(async () => {
  let raw = null;
  try { raw = sessionStorage.getItem(KEY); if (!raw) { const r = JSON.parse(localStorage.getItem(KEY) || 'null'); if (r && r.exp > Date.now()) raw = r.k; else localStorage.removeItem(KEY); } } catch (e) { }
  if (!raw) return;
  try { await open_(await imp(raw)); } catch (e) { try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (_) { } }
})();
</script>
